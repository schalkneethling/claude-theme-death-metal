<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- The plugin icon: a raven on a dead branch against the theme's blood moon.
       .claude-plugin/icon.png is this file rendered at 1024 by 1024. -->
  <defs>
    <radialGradient id="night" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#4a0a0a"/>
      <stop offset="1" stop-color="#050203"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0.55" stop-color="#ff3b1f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff3b1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ff9a6a"/>
      <stop offset="0.45" stop-color="#d52c1b"/>
      <stop offset="1" stop-color="#5e0806"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#night)"/>
  <circle cx="512" cy="450" r="470" fill="url(#halo)"/>
  <circle cx="512" cy="450" r="330" fill="url(#moon)"/>
  <!-- The branch and its twigs -->
  <g fill="none" stroke="#050203" stroke-linecap="round">
    <path d="M-20,860 C200,800 420,800 620,770 C780,746 900,700 1050,640" stroke-width="34"/>
    <path d="M700,756 C760,700 800,640 820,560" stroke-width="16"/>
    <path d="M790,640 C830,620 860,590 880,540" stroke-width="9"/>
    <path d="M250,812 C230,760 190,720 130,700" stroke-width="14"/>
    <path d="M190,738 C170,700 160,670 164,630" stroke-width="8"/>
    <path d="M900,694 C930,650 950,600 954,540" stroke-width="10"/>
  </g>
  <!-- The raven, in profile, facing right -->
  <g fill="#050203">
    <path d="M770,330 C728,312 694,298 662,290 C640,258 588,246 552,268 C516,288 498,322 482,358 C438,432 378,522 318,612 L222,772 L262,778 L244,806 L300,784 L296,818 L354,772 C400,742 440,718 470,702 C522,690 572,650 602,590 C628,540 638,500 642,460 L622,452 L650,436 L634,420 L664,410 C680,392 690,376 698,360Z"/>
    <path d="M520,690 L534,790 M476,700 L484,792 M534,790 L572,800 M534,790 L500,806 M484,792 L520,804 M484,792 L450,806" stroke="#050203" stroke-width="13" stroke-linecap="round" fill="none"/>
  </g>
  <path d="M506,384 C448,468 388,556 316,668 C408,650 500,596 560,500 C582,452 566,406 506,384Z" fill="#1a0a0c"/>
  <circle cx="640" cy="316" r="10" fill="#ff5a36"/>
</svg>
